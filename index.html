<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>AutoMark</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <span class="navbar-brand mb-0 h1"><i class="bi bi-droplet-half"></i> AutoMark</span>
  </div>
</nav>

<div class="container">
  <div class="row g-4">

    <!-- Colonne gauche : formulaire -->
    <div class="col-md-7">
      <div class="card shadow-sm">
        <div class="card-body">

          <h5 class="card-title mb-3">Configuration</h5>

          <div class="mb-3">
            <label class="form-label fw-bold">1. Dossier source</label><br>
            <button class="btn btn-outline-primary" id="pickSourceBtn">
              <i class="bi bi-folder2-open"></i> Choisir
            </button>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">2. Dossier destination</label><br>
            <button class="btn btn-outline-primary" id="pickDestBtn">
              <i class="bi bi-folder2-open"></i> Choisir
            </button>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">3. Texte du filigrane</label>
            <input id="watermarkTextInput" class="form-control" value="CONFIDENTIEL">
          </div>

          <button class="btn btn-success w-100" id="runBtn">
            <i class="bi bi-play-fill"></i> Lancer
          </button>

        </div>
      </div>
    </div>

    <!-- Colonne droite : sélections + journal -->
    <div class="col-md-5">

      <div class="card shadow-sm mb-3">
        <div class="card-header bg-white fw-bold">Sélection actuelle</div>
        <ul class="list-group list-group-flush">
          <li class="list-group-item d-flex align-items-center" id="sourceItem">
            <i class="bi bi-folder2 text-secondary me-2 fs-5"></i>
            <div>
              <div class="small text-muted">Source</div>
              <div id="sourceName">Aucun dossier choisi</div>
            </div>
          </li>
          <li class="list-group-item d-flex align-items-center" id="destItem">
            <i class="bi bi-folder2 text-secondary me-2 fs-5"></i>
            <div>
              <div class="small text-muted">Destination</div>
              <div id="destName">Aucun dossier choisi</div>
            </div>
          </li>
        </ul>
      </div>

      <div class="card shadow-sm">
        <div class="card-header bg-white fw-bold">Journal</div>
        <div class="card-body">
          <pre id="logOutput" class="mb-0 small"></pre>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Spacer -->
<div class="flex-grow-1"></div>

<!-- Copyright -->
<p class="text-center text-muted mt-auto">© 2026 Hugo Helluy</p>

<!-- Scripts -->
<script src="js/ui.js"></script>
<script src="js/watermark.js"></script>
<script src="js/fileSystem.js"></script>
<script src="js/main.js"></script>

</body>
</html>
